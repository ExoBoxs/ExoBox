<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sea Breeze Eco Box</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div id="uv-screen">
        <button class="close-uv" onclick="toggleUV()">✕</button>
        <div class="uv-glow"></div>
        <p class="uv-text">UV SCANNER ACTIVE</p>
    </div>

    <header>
        <div class="logo">SEA BREEZE <span>ECO</span></div>
        <select id="lang-select" onchange="changeLang()">
            <option value="ru">RU</option>
            <option value="az">AZ</option>
            <option value="en">EN</option>
        </select>
    </header>

    <section id="home" class="page active">
        <div class="hero">
            <h2 data-key="welcome">Привет, Герой!</h2>
            <p data-key="hero-text">Твоя экспедиция начинается.</p>
        </div>
    </section>

    <section id="tools" class="page">
        <div class="tool-grid">
            <div class="tool-item" onclick="toggleFlash()"><i class="fas fa-bolt"></i><span data-key="t-light">Фонарик</span></div>
            <div class="tool-item" onclick="toggleUV()"><i class="fas fa-eye"></i><span data-key="t-uv">УФ-Режим</span></div>
            <div class="tool-item" onclick="playAudio()"><i class="fas fa-headset"></i><span data-key="t-audio">Аудиогид</span></div>
            <div class="tool-item" id="compass-card"><i class="fas fa-compass" id="comp-arrow"></i><span id="comp-deg">0°</span></div>
        </div>
    </section>

    <section id="camera" class="page">
        <div class="cam-container">
            <video id="video" autoplay playsinline></video>
            <button class="snap-btn" onclick="takePhoto()"></button>
        </div>
    </section>

    <section id="feed" class="page">
        <h3 data-key="feed-title">Лента открытий</h3>
        <div id="feed-list"></div>
    </section>

    <nav class="tab-bar">
        <div class="tab-item active" onclick="showPage('home')"><i class="fas fa-home"></i></div>
        <div class="tab-item" onclick="showPage('tools')"><i class="fas fa-toolbox"></i></div>
        <div class="tab-item" onclick="showPage('camera')"><i class="fas fa-camera"></i></div>
        <div class="tab-item" onclick="showPage('feed')"><i class="fas fa-images"></i></div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
