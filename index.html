<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sea Breeze Eco Box</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">SEA BREEZE <span>ECO</span></div>
        <div class="wallet">🪙 <span id="balance-val">250</span></div>
    </header>

    <main id="main-content">
        <div class="tool-grid">
            <div class="tool-card" onclick="toggleFlash()">
                <i class="fas fa-bolt"></i>
                <span>Фонарик</span>
            </div>
            <div class="tool-card" onclick="playAudio()">
                <i class="fas fa-volume-up"></i>
                <span>Аудиогид</span>
            </div>
            <div class="tool-card" onclick="openCamera()">
                <i class="fas fa-camera"></i>
                <span>Эко-сканер</span>
            </div>
            <div class="tool-card" onclick="alert('Используй компас из Eco-Box!')">
                <i class="fas fa-compass"></i>
                <span>Компас</span>
            </div>
        </div>

        <section class="feed-section">
            <h3>Лента экспедиции</h3>
            <div id="feed-container">
                </div>
        </section>
    </main>

    <div id="camera-overlay">
        <video id="video" autoplay playsinline></video>
        <div class="cam-btns">
            <button class="close-btn" onclick="closeCamera()">×</button>
            <button class="snap-btn" onclick="takeSnapshot()"></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
